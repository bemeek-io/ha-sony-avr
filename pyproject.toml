[project]
name = "ha-sony-avr"
version = "0.1.0"
description = "Home Assistant integration for Sony AV receivers using IRCC-IP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-aiohttp>=1.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# N818 wants an "Error" suffix on exception names, but CannotConnect and
# InvalidAuth are the names Home Assistant's config-flow docs use, and matching
# that convention is worth more here than the lint.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
