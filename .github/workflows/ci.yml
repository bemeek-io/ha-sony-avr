name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.13']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately not an editable install: it leaves a finder path hook on
      # sys.path that Home Assistant's integration loader tries to scandir,
      # which fails. pyproject sets pythonpath = ["."], so the package is
      # importable without it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-aiohttp ruff
          pip install homeassistant pytest-homeassistant-custom-component

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest tests/ -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
